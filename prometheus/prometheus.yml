global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'infrastructure-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Linux servers
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
          # Add your servers below:
          # - '192.168.1.10:9100'
          # - '192.168.1.11:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Windows Exporter
  # - job_name: 'windows-exporter'
  #   static_configs:
  #     - targets:
  #         - '192.168.1.20:9182'

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
