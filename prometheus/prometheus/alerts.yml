groups:
  - name: infrastructure_alerts
    rules:

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta em {{ $labels.instance }}"
          description: "CPU acima de 85% por mais de 5 minutos. Valor atual: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memória alta em {{ $labels.instance }}"
          description: "Uso de memória acima de 85%. Valor atual: {{ $value }}%"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disco alto em {{ $labels.instance }}"
          description: "Uso de disco acima de 80% em {{ $labels.mountpoint }}. Valor atual: {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRÍTICO: Disco cheio em {{ $labels.instance }}"
          description: "Uso de disco acima de 90% em {{ $labels.mountpoint }}. Valor atual: {{ $value }}%"

      - alert: HostDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Host offline: {{ $labels.instance }}"
          description: "O host {{ $labels.instance }} está inacessível há mais de 1 minuto."

      - alert: HighLoadAverage
        expr: node_load1 > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Load alto em {{ $labels.instance }}"
          description: "Load average (1m) acima de 4. Valor atual: {{ $value }}"
