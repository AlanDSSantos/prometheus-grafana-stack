global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertas@seudominio.com'
  smtp_auth_username: 'alertas@seudominio.com'
  smtp_auth_password: 'sua-senha-aqui'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'email-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'email-alerts'
      repeat_interval: 1h

receivers:
  - name: 'email-alerts'
    email_configs:
      - to: 'seu-email@gmail.com'
        send_resolved: true
        headers:
          Subject: '[ALERTA] {{ .GroupLabels.alertname }} - {{ .CommonLabels.instance }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
